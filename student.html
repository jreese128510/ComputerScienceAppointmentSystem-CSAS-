<script>

let user = localStorage.getItem("csasUser");

if(!user){

    document.body.innerHTML = `
        <div style="
            text-align:center;
            margin-top:100px;
            font-family:Arial;
        ">
            <h1>Access Denied</h1>

            <p>
                You must login before accessing
                the Student Management page.
            </p>

            <button
            onclick="
                window.location.href='login.html'
            "
            style="
                padding:10px 20px;
                background:#15803D;
                color:white;
                border:none;
                border-radius:5px;
                cursor:pointer;
            ">
                Go To Login
            </button>
        </div>
    `;

}
else{

    document.getElementById(
        "usernameDisplay"
    ).innerHTML =
    "👤 " + user + " ▼";
}

function toggleMenu(){

    const menu =
    document.getElementById(
        "dropdown"
    );

    menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";
}

function signOut(){

    localStorage.removeItem(
        "csasUser"
    );

    window.location.href =
    "index.html";
}

</script>
