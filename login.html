<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSAS Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #F0FDF4;
            color: #14532D;
            min-height: 100vh;
        }

        /* Navigation */
        .navbar {
            background-color: #14532D;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            color: #DCFCE7;
            text-decoration: none;
            margin-left: 25px;
        }

        .navbar a:hover {
            color: #22C55E;
        }

        /* Login Container */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .login-card h1 {
            text-align: center;
            color: #14532D;
            margin-bottom: 10px;
        }

        .login-card p {
            text-align: center;
            color: #64748B;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #BBF7D0;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #15803D;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #15803D;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .login-btn:hover {
            background-color: #14532D;
        }

        .guest-btn {
            width: 100%;
            padding: 12px;
            border: 2px solid #15803D;
            background-color: white;
            color: #15803D;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .guest-btn:hover {
            background-color: #DCFCE7;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        footer {
            background-color: #14532D;
            color: #DCFCE7;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🎓 CSAS</div>

        <div>
            <a href="index.html">Home</a>
            <a href="appointments.html">Appointments</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="login-container">

        <div class="login-card">

            <h1>Login</h1>

            <p>Sign in to access your CSAS dashboard.</p>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter Username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password">
            </div>

            <button class="login-btn" onclick="loginUser()">
                Login
            </button>

            <button class="guest-btn" onclick="continueAsGuest()">
                Continue as Guest
            </button>

            <div class="message" id="message"></div>

        </div>

    </div>

    <footer>
        <p>© 2026 CSAS - Student Appointment Management System</p>
    </footer>

    <script>
        function loginUser(){

    const username =
        document.getElementById(
            "username"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;

    if(
        username === "admin" &&
        password === "csas123"
    ){

        localStorage.setItem(
            "csasUser",
            username
        );

        window.location.href =
            "students.html";

    } else {

        alert(
            "Invalid Username or Password"
        );
    }
}
    </script>

</body>
</html>
